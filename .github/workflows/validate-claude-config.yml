# Fails the PR/build if any CLAUDE.md @-import or skill reference points at a
# file that does not exist, so broken .claude workflow config is caught on
# every push instead of failing silently mid-build.
name: Validate Claude Config

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate .claude workflow references
        run: node .claude/scripts/validate-claude-config.mjs
