# Drop into the generated site at .github/workflows/accessibility-contrast.yml
# Fails the PR/build if any color pairing in accessibility/contrast.config.json
# drops below its WCAG AA target (or references a token that no longer exists),
# then runs the coverage linter to surface UI color tokens no pairing checks.
name: Accessibility — Color Contrast

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contrast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify color contrast (WCAG AA)
        run: node scripts/contrast-check.mjs
      - name: Coverage — tokens not in the manifest
        # Warn-only by default; add --strict (or coverage.failOnUncovered) to gate.
        run: node scripts/contrast-coverage.mjs
