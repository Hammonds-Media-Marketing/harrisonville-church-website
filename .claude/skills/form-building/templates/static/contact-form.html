<!--
  Static (vanilla HTML) contact form — the GitHub Pages counterpart to
  ContactForm.tsx.template. Progressive enhancement:
    - Without JS: the browser POSTs straight to the `action` endpoint (Formspree
      returns its own thank-you page).
    - With JS (attribution.js): hidden tracking fields are populated from URL +
      localStorage, and submit is upgraded to an AJAX fetch that swaps in the
      inline success/error message without a page navigation.

  Setup:
    1. Set `action` to the real endpoint from the brief (ask if not supplied).
    2. Adapt the visible fields/labels to the project; keep the honeypot and the
       hidden tracking inputs exactly as named — attribution.js targets them by
       `name`.
    3. Include attribution.js once per page: <script src="assets/js/attribution.js" defer></script>
-->
<form
  data-attribution-form
  action="https://formspree.io/f/REPLACE_WITH_FORM_ID"
  method="POST"
  aria-label="Contact form"
  novalidate
>
  <!-- Honeypot: bots fill it, humans never see it. Formspree drops any
       submission with a non-empty _gotcha. Hidden accessibly + off the tab order. -->
  <input
    type="text"
    name="_gotcha"
    tabindex="-1"
    autocomplete="off"
    aria-hidden="true"
    style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0"
  />

  <!-- Hidden tracking fields. Populated by attribution.js from URL + localStorage.
       Do not rename or wrap these — the script targets them by `name`. -->
  <input type="hidden" name="utm_source" />
  <input type="hidden" name="utm_medium" />
  <input type="hidden" name="utm_campaign" />
  <input type="hidden" name="utm_content" />
  <input type="hidden" name="utm_term" />
  <input type="hidden" name="gclid" />
  <input type="hidden" name="msclkid" />
  <input type="hidden" name="original_referrer" />

  <!-- Visible fields. Adapt names/labels/required flags to the project. -->
  <div>
    <label for="contact-first-name">First Name <span aria-hidden="true">*</span></label>
    <input id="contact-first-name" name="firstName" type="text" required autocomplete="given-name" aria-required="true" />
  </div>

  <div>
    <label for="contact-last-name">Last Name <span aria-hidden="true">*</span></label>
    <input id="contact-last-name" name="lastName" type="text" required autocomplete="family-name" aria-required="true" />
  </div>

  <div>
    <label for="contact-phone">Phone <span aria-hidden="true">*</span></label>
    <input id="contact-phone" name="phone" type="tel" required autocomplete="tel" aria-required="true" />
  </div>

  <div>
    <label for="contact-email">Email</label>
    <input id="contact-email" name="email" type="email" autocomplete="email" />
  </div>

  <div>
    <label for="contact-topic">Topic</label>
    <select id="contact-topic" name="topic">
      <option value="">Select a topic</option>
      <option value="General Inquiry">General Inquiry</option>
      <option value="Sales Question">Sales Question</option>
      <option value="Support">Support</option>
      <option value="Other">Other</option>
    </select>
  </div>

  <div>
    <label for="contact-message">Message</label>
    <textarea id="contact-message" name="message" rows="4"></textarea>
  </div>

  <!-- Error region: shown by attribution.js on a failed AJAX submit. -->
  <p data-form-error role="alert" aria-live="assertive" hidden>
    Something went wrong. Please try again or contact us directly.
  </p>

  <button type="submit">Send</button>
</form>

<!-- Success region: revealed by attribution.js after a successful submit; the
     form is hidden. Lives as a sibling so the script can toggle both. -->
<div data-form-success role="alert" aria-live="polite" hidden>
  <p>Thank you! We received your request.</p>
  <p>Someone from our team will reach out to you shortly.</p>
</div>
